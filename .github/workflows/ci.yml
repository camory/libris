# Continuous integration. Changed by humans only (the agent token has no
# workflow permission). Jobs skip themselves until their module exists.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: libris
          POSTGRES_USER: libris
          POSTGRES_PASSWORD: libris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U libris -d libris"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      LIBRIS_DB_URL: jdbc:postgresql://localhost:5432/libris
      LIBRIS_DB_USER: libris
      LIBRIS_DB_PASSWORD: libris
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f backend/gradlew && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "backend not present yet"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - if: steps.present.outputs.yes == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        run: ./gradlew check --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f frontend/package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "frontend not present yet"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: steps.present.outputs.yes == 'true'
        name: Install Contracteer CLI (mock server for the frontend tests, D04)
        env: { CONTRACTEER_VERSION: '4.0.0', CONTRACTEER_SHA256: '781be856f0f1764c8cf6fa0936bc767ba5733d90f289780f066f33d7e0c7f52e' }
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o contracteer.zip "https://github.com/contracteer-dev/contracteer/releases/download/${CONTRACTEER_VERSION}/contracteer-${CONTRACTEER_VERSION}-linux-x86_64.zip"
          echo "${CONTRACTEER_SHA256}  contracteer.zip" | sha256sum -c -
          unzip -q contracteer.zip
          sudo install -m 0755 "contracteer-${CONTRACTEER_VERSION}-linux-x86_64/bin/contracteer" /usr/local/bin/contracteer
          contracteer --version
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm ci && npm test && npm run build

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks scans the whole history
      - name: Install gitleaks (pinned, checksummed)
        env: { GITLEAKS_VERSION: '8.30.1', GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' }
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: No credential anywhere in the history
        run: gitleaks git . --no-banner --redact
      - name: Loop scripts parse, schemas are JSON
        run: bash -n agent/loop.sh agent/hooks/*.sh && python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('agent/schemas/*.json')]"
      - name: Orchestrator state derivation behaves
        run: bash agent/test-loop.sh
      - name: Guard hook behaves
        run: bash agent/hooks/test-guard-git.sh
      - name: Proof-of-test hooks behave
        run: bash agent/hooks/test-proof.sh

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/camory
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.PUSH == 'true'
        name: Log in to GHCR
        env: { TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Build backend and frontend images (push on main)
        run: |
          tag="sha-${GITHUB_SHA::7}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for side in backend frontend; do
            if [ ! -f "$side/Dockerfile" ]; then echo "$side/Dockerfile not present yet"; continue; fi
            image="$REGISTRY/libris-$side:$tag"
            docker build "$side" -t "$image" \
              --build-arg "VERSION=$tag" \
              --label "org.opencontainers.image.version=$tag" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.created=$created" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            if [ "$PUSH" = true ]; then docker push "$image"; fi
          done
