spring:
  datasource:
    url: ${LIBRIS_DB_URL}
    username: ${LIBRIS_DB_USER}
    password: ${LIBRIS_DB_PASSWORD}
libris:
  covers:
    directory: ${LIBRIS_COVERS_DIR:}
  sources:
    bnf-url: ${LIBRIS_BNF_URL:https://catalogue.bnf.fr/api/SRU}
    bnf-covers-url: ${LIBRIS_BNF_COVERS_URL:https://catalogue.bnf.fr/couverture}
    open-library-url: ${LIBRIS_OPEN_LIBRARY_URL:https://openlibrary.org}
    open-library-covers-url: ${LIBRIS_OPEN_LIBRARY_COVERS_URL:https://covers.openlibrary.org/b/isbn}
    inventaire-url: ${LIBRIS_INVENTAIRE_URL:https://inventaire.io}
    timeout: ${LIBRIS_SOURCE_TIMEOUT:5s}
  worker:
    every: ${LIBRIS_WORKER_PERIOD:P1D}
management:
  endpoints:
    web:
      exposure:
        include: health,info
