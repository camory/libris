# Sandbox for loop iterations + a throwaway PostgreSQL.
#   docker compose -f agent/compose.yaml build agent
#   docker compose -f agent/compose.yaml run --rm agent 'claude --version'
# Secrets and limits come from agent/.env (see agent/.env.example).
name: libris-agent

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: libris
      POSTGRES_USER: libris
      POSTGRES_PASSWORD: libris
    ports:
      - "127.0.0.1:5432:5432"   # also handy for a human running the backend on the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libris -d libris"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data   # throwaway on purpose: every iteration starts clean

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${AGENT_UID:-1000}
        GID: ${AGENT_GID:-1000}
    image: libris-agent:local
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /work
    environment:
      # --- who the agent is ---
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Tophe}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-christophe@amory.fr}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Tophe}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-christophe@amory.fr}
      # --- credentials (from agent/.env, never committed) ---
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      # --- database the tests use (D08) ---
      LIBRIS_DB_URL: jdbc:postgresql://postgres:5432/libris
      LIBRIS_DB_USER: libris
      LIBRIS_DB_PASSWORD: libris
      # --- quieter, deterministic tooling ---
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain
      CI: "true"
    volumes:
      - ..:/work                       # the repository, and nothing else from the host
      - gradle-cache:/home/agent/.gradle
      - npm-cache:/home/agent/.npm
      - claude-state:/home/agent/.claude   # keeps session transcripts between runs for debugging
    deploy:
      resources:
        limits:                        # bestheda also runs Grafana, Home Assistant and Plex
          cpus: "3"
          memory: 6g

volumes:
  gradle-cache:
  npm-cache:
  claude-state:

networks:
  default:
    name: libris-sandbox
    ipam:
      config:
        - subnet: 172.30.0.0/24       # fixed so agent/host/sandbox-firewall.sh can target it
