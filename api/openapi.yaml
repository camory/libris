openapi: 3.0.3
info:
  title: Libris API
  version: 0.1.0
paths:
  /api/v1/me:
    get:
      summary: The reader making the request, as Authelia describes them
      responses:
        "200":
          description: The reader's identity and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentReader"
components:
  schemas:
    CurrentReader:
      type: object
      additionalProperties: false
      required: [username, displayName, email, role]
      properties:
        username:
          type: string
          nullable: false
          minLength: 1
        displayName:
          type: string
          nullable: false
          minLength: 1
        email:
          type: string
          format: email
          nullable: false
        role:
          type: string
          nullable: false
          enum: [READER, ADMIN]
